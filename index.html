<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatística e Ciência de Dados</title>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background 0.5s ease;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }
        .hero-container {
            max-width: 900px;
            padding: 20px;
        }
        h1 {
            font-size: 3.2rem;
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 25px;
            font-family: 'Georgia', 'Times New Roman', serif;
            text-transform: uppercase;
        }
        .divider-line {
            display: inline-block;
            border-top: 5px solid rgba(41, 36, 31, 0.4);
            border-bottom: 5px solid rgba(41, 36, 31, 0.4);
            padding: 12px 25px;
        }
        p {
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            margin: 0;
            font-family: 'Arial', sans-serif;
            text-transform: lowercase;
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <h1 id="titulo-principal">Carregando...</h1>
        <div class="divider-line">
            <p id="subtitulo-secundario">verificando...</p>
        </div>
    </div>

    <script>
        const diasConfig = {
            0: { 
                fundo: "linear-gradient(rgba(255,255,255, 0.15), rgba(255,255,255, 0.85)), url('Domingo.png')", 
                tipo: "imagem",
                corTitulo: "#2F2923",    // Coloca a cor desejada para o Título (ex: verde escuro elegante)
                corSubtitulo: "#8c5830", // Coloca a cor desejada para o Subtítulo (ex: tom nougat/terroso)
                titulo: "Mathematics & Statistics",
                subtitulo: "The language of patterns, uncertainty and discovery"
            },
            1: { 
                fundo: "#FFD1DC", 
                tipo: "cor", 
                corTitulo: "#333333",
                corSubtitulo: "#555555",
                titulo: "Segunda-feira",
                subtitulo: "tema aplicado para segunda-feira"
            },
            2: { 
                fundo: "#FFDFBA", 
                tipo: "cor", 
                corTitulo: "#333333",
                corSubtitulo: "#555555",
                titulo: "Terça-feira",
                subtitulo: "tema aplicado para terça-feira"
            },
            3: { 
                fundo: "#FFFFBA", 
                tipo: "cor", 
                corTitulo: "#333333",
                corSubtitulo: "#555555",
                titulo: "Quarta-feira",
                subtitulo: "tema aplicado para quarta-feira"
            },
            4: { 
                fundo: "#BAFFC9", 
                tipo: "cor", 
                corTitulo: "#333333",
                corSubtitulo: "#555555",
                titulo: "Quinta-feira",
                subtitulo: "tema aplicado para quinta-feira"
            },
            5: { 
                fundo: "#BAE1FF", 
                tipo: "cor", 
                corTitulo: "#333333",
                corSubtitulo: "#555555",
                titulo: "Sexta-feira",
                subtitulo: "tema aplicado para sexta-feira"
            },
            6: { 
                fundo: "#E8C5FF", 
                tipo: "cor", 
                corTitulo: "#333333",
                corSubtitulo: "#555555",
                titulo: "Sábado",
                subtitulo: "tema aplicado para sábado"
            }
        };

        const hoje = new Date().getDay();
        const configDia = diasConfig[hoje];

        if (configDia.tipo === "imagem") {
            document.body.style.backgroundImage = configDia.fundo;
            document.body.style.backgroundColor = "transparent";
        } else {
            document.body.style.backgroundImage = "none";
            document.body.style.backgroundColor = configDia.fundo;
        }

        // Aplica as cores separadamente no título e subtítulo
        document.getElementById("titulo-principal").style.color = configDia.corTitulo;
        document.getElementById("subtitulo-secundario").style.color = configDia.corSubtitulo;

        // Insere os textos
        document.getElementById("titulo-principal").innerText = configDia.titulo;
        document.getElementById("subtitulo-secundario").innerText = configDia.subtitulo;
    </script>
</body>
</html>
