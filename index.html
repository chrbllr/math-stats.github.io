<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Estatística e Ciência de Dados</title>


    <!-- =====================================================
         GOOGLE FONT — CORMORANT GARAMOND
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

        }


        /* =====================================================
           BODY
        ====================================================== */

        body {

            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            font-family:
                'Cormorant Garamond',
                Georgia,
                'Times New Roman',
                serif;

            background-color: #e8dfcf;

        }


        /* =====================================================
           IMAGEM DE FUNDO
        ====================================================== */

        #imagem-fundo {

            position: absolute;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;

            display: block;

            object-fit: fill;

            object-position: center;

            z-index: 0;

        }


        /* =====================================================
           GRADIENTE SOBRE A IMAGEM
        ====================================================== */

        #overlay {

            position: absolute;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, 0.15),
                    rgba(255, 255, 255, 0.85)
                );

            z-index: 1;

            pointer-events: none;

        }


        /* =====================================================
           CONTEÚDO CENTRAL
        ====================================================== */

        .hero-container {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 90vw;

            max-width: 1100px;

            text-align: center;

            z-index: 2;

        }


        /* =====================================================
           TÍTULO
        ====================================================== */

        h1 {

            margin:
                0 0 25px 0;

            font-family:
                'Cormorant Garamond',
                Georgia,
                'Times New Roman',
                serif;

            font-size:
                clamp(2.2rem, 5vw, 4.2rem);

            font-weight: 600;

            font-style: normal;

            line-height: 1.05;

            letter-spacing: 2px;

            color: #2F2923;

            text-transform: uppercase;

        }


        /* =====================================================
           DIVISOR
        ====================================================== */

        .divider-line {

            display: inline-block;

            padding:
                10px 25px 8px 25px;

            border-top:
                2px solid
                rgba(47, 41, 35, 0.45);

            border-bottom:
                2px solid
                rgba(47, 41, 35, 0.45);

        }


        /* =====================================================
           SUBTÍTULO
        ====================================================== */

        p {

            margin: 0;

            font-family:
                'Cormorant Garamond',
                Georgia,
                'Times New Roman',
                serif;

            font-size:
                clamp(1rem, 2vw, 1.4rem);

            font-weight: 600;

            font-style: normal;

            line-height: 1.3;

            letter-spacing: 0.6px;

            color: #7E4F2B;

            text-transform: none;

        }


        /* =====================================================
           COPYRIGHT
        ====================================================== */

        .copyright {

            position: fixed;

            left: 50%;
            bottom: 18px;

            transform:
                translateX(-50%);

            z-index: 3;

            width: 100%;

            padding:
                0 20px;

            text-align: center;

            font-family:
                'Cormorant Garamond',
                Georgia,
                'Times New Roman',
                serif;

            font-size:
                clamp(0.78rem, 1.2vw, 0.95rem);

            font-weight: 500;

            font-style: normal;

            letter-spacing: 0.4px;

            line-height: 1.2;

            color:
                rgba(47, 41, 35, 0.9);

            text-shadow:
                0 1px 2px
                rgba(255, 255, 255, 0.45);

            pointer-events: none;

        }


        /* =====================================================
           CELULAR
        ====================================================== */

        @media (max-width: 600px) {

            .hero-container {

                width: 92vw;

            }


            h1 {

                font-size: 2.3rem;

                letter-spacing: 1px;

                margin-bottom: 20px;

            }


            .divider-line {

                padding:
                    8px 14px 7px 14px;

                border-top-width: 1px;

                border-bottom-width: 1px;

            }


            p {

                font-size: 1.05rem;

                letter-spacing: 0.3px;

            }


            .copyright {

                bottom: 12px;

                font-size: 0.78rem;

                padding:
                    0 10px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         IMAGEM DE FUNDO
    ====================================================== -->

    <img
        id="imagem-fundo"
        src="Domingo.png"
        alt=""
    >


    <!-- =====================================================
         GRADIENTE
    ====================================================== -->

    <div id="overlay"></div>


    <!-- =====================================================
         CONTEÚDO CENTRAL
    ====================================================== -->

    <div class="hero-container">

        <h1 id="titulo-principal">
            Carregando...
        </h1>

        <div class="divider-line">

            <p id="subtitulo-secundario">
                verificando...
            </p>

        </div>

    </div>


    <!-- =====================================================
         COPYRIGHT
         
         A data será preenchida automaticamente pelo JavaScript.
    ====================================================== -->

    <div
        id="copyright"
        class="copyright">
    </div>


    <script>

        /* =====================================================
           CONFIGURAÇÃO DOS DIAS
        ====================================================== */

        const diasConfig = {

            0: {

                imagem: "Domingo.png",

                corTitulo: "#2F2923",

                corSubtitulo: "#7E4F2B",

                titulo:
                    "Mathematics & Statistics",

                subtitulo:
                    "The language of patterns, uncertainty and discovery"

            },


            1: {

                imagem: "Segunda.png",

                corTitulo: "#2F2923",

                corSubtitulo: "#7E4F2B",

                titulo:
                    "Mathematics & Statistics",

                subtitulo:
                    "The language of patterns, uncertainty and discovery"

            },


            2: {

                imagem: null,

                fundo: "#FFDFBA",

                corTitulo: "#333333",

                corSubtitulo: "#555555",

                titulo:
                    "Terça-feira",

                subtitulo:
                    "tema aplicado para terça-feira"

            },


            3: {

                imagem: null,

                fundo: "#FFFFBA",

                corTitulo: "#333333",

                corSubtitulo: "#555555",

                titulo:
                    "Quarta-feira",

                subtitulo:
                    "tema aplicado para quarta-feira"

            },


            4: {

                imagem: null,

                fundo: "#BAFFC9",

                corTitulo: "#333333",

                corSubtitulo: "#555555",

                titulo:
                    "Quinta-feira",

                subtitulo:
                    "tema aplicado para quinta-feira"

            },


            5: {

                imagem: null,

                fundo: "#BAE1FF",

                corTitulo: "#333333",

                corSubtitulo: "#555555",

                titulo:
                    "Sexta-feira",

                subtitulo:
                    "tema aplicado para sexta-feira"

            },


            6: {

                imagem: null,

                fundo: "#E8C5FF",

                corTitulo: "#333333",

                corSubtitulo: "#555555",

                titulo:
                    "Sábado",

                subtitulo:
                    "tema aplicado para sábado"

            }

        };


        /* =====================================================
           ELEMENTOS
        ====================================================== */

        const imagem =
            document.getElementById(
                "imagem-fundo"
            );

        const overlay =
            document.getElementById(
                "overlay"
            );

        const titulo =
            document.getElementById(
                "titulo-principal"
            );

        const subtitulo =
            document.getElementById(
                "subtitulo-secundario"
            );


        /* =====================================================
           DIA ATUAL
        ====================================================== */

        const hoje =
            new Date().getDay();

        const config =
            diasConfig[hoje];


        /* =====================================================
           TEXTO PRINCIPAL
        ====================================================== */

        titulo.textContent =
            config.titulo;

        subtitulo.textContent =
            config.subtitulo;


        /* =====================================================
           CORES
        ====================================================== */

        titulo.style.color =
            config.corTitulo;

        subtitulo.style.color =
            config.corSubtitulo;


        /* =====================================================
           IMAGEM OU COR
        ====================================================== */

        if (config.imagem) {

            imagem.src =
                config.imagem;

            imagem.style.display =
                "block";

            overlay.style.display =
                "block";

            document.body.style.backgroundColor =
                "transparent";

        }

        else {

            imagem.style.display =
                "none";

            overlay.style.display =
                "none";

            document.body.style.backgroundColor =
                config.fundo;

        }


        /* =====================================================
           AJUSTE DA IMAGEM À TELA
        ====================================================== */

        function ajustarImagem() {

            if (!config.imagem) {
                return;
            }

            imagem.style.width =
                window.innerWidth + "px";

            imagem.style.height =
                window.innerHeight + "px";

            overlay.style.width =
                window.innerWidth + "px";

            overlay.style.height =
                window.innerHeight + "px";

        }


        /* =====================================================
           COPYRIGHT
           
           Obtém automaticamente o ano atual.
        ====================================================== */

        const anoAtual =
            new Date().getFullYear();

        document.getElementById(
            "copyright"
        ).textContent =
            `© ${anoAtual} Christian Boller. All rights reserved.`;


        /* =====================================================
           PRIMEIRO AJUSTE
        ====================================================== */

        ajustarImagem();


        /* =====================================================
           REDIMENSIONAMENTO
        ====================================================== */

        window.addEventListener(
            "resize",
            ajustarImagem
        );


        /* =====================================================
           ORIENTAÇÃO DO DISPOSITIVO
        ====================================================== */

        window.addEventListener(
            "orientationchange",
            function () {

                setTimeout(
                    ajustarImagem,
                    100
                );

            }
        );

    </script>

</body>

</html>
